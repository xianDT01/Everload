# Application-specific reviews, not general exemptions for Spring dependencies.
# Evidence and review trigger: docs/security-beta.md and RenderingSecurityAssumptionsTest.
vulnerabilities:
  - id: CVE-2026-47884
    purls:
      - pkg:maven/org.springframework/spring-webmvc@6.2.19
    expired_at: 2026-12-18
    statement: EverLoad does not configure XsltView or XsltViewResolver; its SPA view is explicitly forward:/index.html. See docs/security-beta.md.
  - id: CVE-2026-47890
    purls:
      - pkg:maven/org.springframework/spring-webmvc@6.2.19
    expired_at: 2026-12-18
    statement: EverLoad does not render view fragments over SSE. It serves an Angular SPA and JSON APIs. See docs/security-beta.md.
